name: CI

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.13.0', '24']
    runs-on: ${{ matrix.os }}
    steps:
      # Deprecated: test against the published Core 0.3.x and MoodlIA 0.3.x it depends on.
      # The sibling repositories no longer contain the synchronization engine.
      - uses: actions/checkout@v4
        with:
          path: coordinator
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install published dependencies
        shell: bash
        working-directory: coordinator
        run: npm ci
      - run: npm run check
        working-directory: coordinator
      - run: npm run pack:check
        working-directory: coordinator
      - run: npm audit --audit-level=high
        working-directory: coordinator
